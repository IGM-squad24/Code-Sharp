<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeSharp - Authentication</title>
  <!-- Google Fonts for a modern look -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
  <!-- Background Image Slider -->
  <div id="auth-bg"></div>

  <div class="auth-container">
    <div class="auth-card glass">
      <div class="tab-buttons">
        <button id="loginTab" class="active">Login</button>
        <button id="signupTab">Sign Up</button>
      </div>
      <div class="form-container">
        <!-- Login Form -->
        <form id="loginForm" class="auth-form active">
          <h2 class="aqua-text">Login to CodeSharp</h2>
          <div class="input-group">
            <label for="loginUsername"><i class="fas fa-user"></i> Username</label>
            <input type="text" id="loginUsername" name="username" placeholder="Enter your username" required />
          </div>
          <div class="input-group">
            <label for="loginPassword"><i class="fas fa-lock"></i> Password</label>
            <input type="password" id="loginPassword" name="password" placeholder="Enter your password" required />
          </div>
          <button type="submit" class="btn btn-aqua">Login</button>
          <div class="additional-links">
            <a href="#">Forgot Password?</a>
          </div>
        </form>
        <!-- Sign Up Form -->
        <form id="signupForm" class="auth-form">
          <h2 class="aqua-text">Sign Up for CodeSharp</h2>
          <div class="input-group">
            <label for="signupUsername"><i class="fas fa-user"></i> Username</label>
            <input type="text" id="signupUsername" name="username" placeholder="Choose a username" required />
          </div>
          <div class="input-group">
            <label for="signupEmail"><i class="fas fa-envelope"></i> Email</label>
            <input type="email" id="signupEmail" name="email" placeholder="Enter your email" required />
          </div>
          <div class="input-group">
            <label for="signupPassword"><i class="fas fa-lock"></i> Password</label>
            <input type="password" id="signupPassword" name="password" placeholder="Create a password" required />
          </div>
          <button type="submit" class="btn btn-aqua">Sign Up</button>
        </form>
      </div>
    </div>
  </div>
  <script src="auth.js"></script>
</body>
</html>
